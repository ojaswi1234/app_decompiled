name: Build and Release Modified NoiseFit APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apktool & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget zipalign apksigner
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -O apktool.jar
          chmod +x apktool
          sudo mv apktool /usr/local/bin/
          sudo mv apktool.jar /usr/local/bin/

      - name: Build APK with Apktool
        run: |
          apktool b . -o app-unsigned.apk

      - name: Align and Sign APK
        run: |
          zipalign -p -f 4 app-unsigned.apk app-aligned.apk
          if [ -f "mod.keystore" ]; then
            apksigner sign --ks mod.keystore --ks-key-alias noisefit --ks-pass pass:password --key-pass pass:password --out NoiseFit-Gemini-Live-Mod.apk app-aligned.apk
          else
            keytool -genkey -v -keystore release.keystore -alias noisefit -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=NoiseFitMod, OU=Engineering, O=Mod, C=US"
            apksigner sign --ks release.keystore --ks-pass pass:password --key-pass pass:password --out NoiseFit-Gemini-Live-Mod.apk app-aligned.apk
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseFit-Gemini-Live-Mod
          path: NoiseFit-Gemini-Live-Mod.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: NoiseFit-Gemini-Live-Mod.apk
          tag_name: v1.0.0-gemini
          name: "NoiseFit with Gemini Smartwatch Call (v1.0.0)"
          body: |
            ### NoiseFit Mod with Bidirectional Gemini Smartwatch Voice Calls
            
            This modified NoiseFit build intercepts calls to your designated Gemini contact from your Noise smartwatch (NSW-433) and runs an ongoing, two-way voice session with Gemini!
            
            #### Features:
            - **Watch Microphone & Watch Speaker (Bluetooth SCO)**: Talk directly into the smartwatch mic and hear Gemini's voice responses loud and clear through your smartwatch's speaker.
            - **Ongoing Call Experience**: Intercepts the cellular call without carrier charges, maintaining an active call loop with a persistent notification and audio focus.
            - **Seamless Conversation Loop**: Gemini speaks, then automatically listens for your next response. Say "Goodbye" or tap End Call on notification/watch to hang up cleanly.
            - **Normal Phone Calls Untouched**: Regular incoming and outgoing calls to friends, family, and other contacts work 100% normally.
            
            #### Quick Setup:
            1. Download and install `NoiseFit-Gemini-Live-Mod.apk` on your Android phone.
            2. In your phone's Contacts app, create a contact named **Gemini** with number **9999999999**.
            3. In the NoiseFit app, go to **Favorite Contacts** -> Add **Gemini** -> tap **Save / Sync to Watch**.
            4. On your smartwatch, tap **Gemini** to start talking to Gemini!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
