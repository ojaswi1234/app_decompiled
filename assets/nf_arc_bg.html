<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    @property --t {
      syntax: '<number>';
      inherits: true;
      initial-value: 0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

    .nf-screen {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background: transparent;

      /* Glow reaches near the top (fades before the top edge) and also fades out
         before the bottom edge so the extra bottom height blends away. */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 84%, transparent 100%);
              mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 84%, transparent 100%);
      -webkit-mask-repeat: no-repeat;
              mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
              mask-size: 100% 100%;

      --nf-hue:         218;
      --nf-pulse-speed:   7s;
      --nf-pulse-depth:   0.55;
      --nf-drift-speed:   19s;
      /* Horizon low so the bright arc sits near the bottom and the glow rises
         up behind the title/subtitle. Large, flat planet so the arc spans the
         full width (end-to-end) instead of diving off the sides. */
      --nf-horizon:       78%;
      --nf-planet:        340%;
      --nf-atmos:         1;
      --nf-intro-delay:   0.1s;
      --nf-intro-reveal:  1.5s;
    }

    /* Intro mask — wipes atmosphere L→R, once */
    .nf-field-mask {
      position: absolute;
      inset: 0;
      -webkit-mask-image: linear-gradient(100deg,
        #000 0%, #000 40%, transparent 60%, transparent 100%);
              mask-image: linear-gradient(100deg,
        #000 0%, #000 40%, transparent 60%, transparent 100%);
      -webkit-mask-size: 250% 100%;
              mask-size: 250% 100%;
      -webkit-mask-repeat: no-repeat;
              mask-repeat: no-repeat;
      -webkit-mask-position: 100% 0;
              mask-position: 100% 0;
      animation: nf-intro-reveal var(--nf-intro-reveal)
                 cubic-bezier(.4, 0, .2, 1)
                 var(--nf-intro-delay) both;
    }

    @keyframes nf-intro-reveal {
      from { -webkit-mask-position: 100% 0; mask-position: 100% 0; }
      to   { -webkit-mask-position:   0% 0; mask-position:   0% 0; }
    }

    .nf-field {
      position: absolute;
      inset: 0;
      animation: nf-breathe var(--nf-pulse-speed)
                 cubic-bezier(.45, 0, .55, 1) infinite;
    }

    @keyframes nf-breathe {
      0%   { --t: 0; }
      50%  { --t: 1; }
      100% { --t: 0; }
    }

    .nf-haze {
      position: absolute;
      left: 50%;
      /* Tall haze anchored at the rim → glow rises from the arc up near the top. */
      top: calc(var(--nf-horizon) - 78%);
      width: 150%;
      height: 78%;
      transform: translateX(-50%);
      background: radial-gradient(
        ellipse 75% 95% at 50% 100%,
        hsla(var(--nf-hue) 85% 62% / 0.26) 0%,
        hsla(var(--nf-hue) 80% 55% / 0.13) 40%,
        transparent 72%
      );
      filter: blur(8px);
      opacity: calc(0.75 + var(--t) * 0.45 * var(--nf-pulse-depth));
    }

    .nf-planet {
      position: absolute;
      left: 50%;
      top: var(--nf-horizon);
      width: var(--nf-planet);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle at 50% 8%,
        hsl(var(--nf-hue) 30% 8%)  0%,
        hsl(var(--nf-hue) 32% 5%) 22%,
        #030406                    48%
      );
      box-shadow:
        0 0 calc(2px   * var(--nf-atmos)) 0
          hsla(var(--nf-hue) 95% 88% / 0.85),
        0 0 calc(22px  * var(--nf-atmos)) calc(1px  * var(--nf-atmos))
          hsla(var(--nf-hue) 88% 68% / calc(0.55 * (0.7 + var(--t) * var(--nf-pulse-depth)))),
        0 0 calc(70px  * var(--nf-atmos)) calc(8px  * var(--nf-atmos))
          hsla(var(--nf-hue) 82% 58% / calc(0.34 * (0.7 + var(--t) * var(--nf-pulse-depth)))),
        0 0 calc(150px * var(--nf-atmos)) calc(36px * var(--nf-atmos))
          hsla(var(--nf-hue) 78% 52% / calc(0.22 * (0.7 + var(--t) * var(--nf-pulse-depth))));
    }

    .nf-crest {
      position: absolute;
      left: 50%;
      top: calc(var(--nf-horizon) - 11%);
      width: 104%;
      height: 20%;
      background: radial-gradient(
        ellipse 46% 100% at 50% 100%,
        hsla(var(--nf-hue) 95% 90% / 0.32)  0%,
        hsla(var(--nf-hue) 90% 72% / 0.14) 44%,
        transparent                          74%
      );
      filter: blur(9px);
      opacity: calc(0.7 + var(--t) * 0.5 * var(--nf-pulse-depth));
      animation: nf-drift var(--nf-drift-speed) ease-in-out infinite;
    }

    @keyframes nf-drift {
      0%, 100% { transform: translateX(-55%); }
      50%       { transform: translateX(-45%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .nf-field-mask { -webkit-mask-image: none; mask-image: none; animation: none; }
      .nf-field, .nf-crest { animation: none; }
    }
  </style>
</head>
<body>
  <div class="nf-screen" id="screen">
    <div class="nf-field-mask">
      <div class="nf-field">
        <div class="nf-haze"></div>
        <div class="nf-planet"></div>
        <div class="nf-crest"></div>
      </div>
    </div>
  </div>

  <script>
    // type → hue: 1=red, 2=green, 3=blue, 4=yellow
    function setType(t) {
      var map = { 1: 5, 2: 142, 3: 218, 4: 48 };
      document.getElementById('screen').style
        .setProperty('--nf-hue', map[t] || 218);
    }
    // initial type from URL hash, e.g. ...nf_arc_bg.html#2
    var t = parseInt((location.hash || '#3').slice(1), 10) || 3;
    setType(t);
  </script>
</body>
</html>
